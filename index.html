<style>
:root{--bg:#F6F0E6;--card:#FFFFFF;--soft:#FBF7F0;--soft2:#F1E8D8;--line:#ECE2D1;--ink:#241F1A;--muted:#6A5E52;--sel:#F3EADC;--dateBg:#F1DCCB;--dateInk:#7A3E24;--clay:#A65A3C;--olive:#6B7A4B;--sea:#2E5A73;--gold:#C98A3A;--callout:#EEF1E6;--hl:#F8E3BE;--shadow:0 10px 24px rgba(36,31,26,.12)}
body.dark{--bg:#17130F;--card:#211B16;--soft:#2A231D;--soft2:#3A3129;--line:#352C25;--ink:#F3EADC;--muted:#B3A594;--sel:#2E2620;--dateBg:#3A2A22;--dateInk:#F1DCCB;--callout:#2A2A20;--hl:#5A4422;--shadow:0 10px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;transition:background-color .35s,color .35s}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:500}
.serif{font-family:Fraunces,Georgia,serif}
.muted{color:var(--muted)}
.wrap{max-width:1600px;margin:0 auto;padding:0 clamp(20px,4vw,72px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;transition:background-color .35s,border-color .35s}
.h2{font-family:Fraunces,serif;font-weight:500;font-size:26px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(18px,1.6vw,28px)}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.btn{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;font-weight:500;transition:transform .12s,background-color .2s}
.btn:active,.press:active{transform:scale(.96)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.ghost{border-color:transparent}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center}
.pill{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-olive{background:#E8ECDD;color:#3D4A26}.p-gold{background:#F8EBD3;color:#6E4B12}.p-sea{background:#E3EDF2;color:#1C3B4D}.p-clay{background:#F3E1D5;color:#7A3E24}.p-grey{background:#EFE6D6;color:#5A4E42}
.input{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 14px;width:100%;min-width:0}
textarea.input{height:auto;padding:10px 14px;resize:vertical}
.input:focus{outline:2px solid var(--clay);outline-offset:1px}
.editor:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.lift{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.zoom img{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.zoom:hover img{transform:scale(1.05)}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{height:8px;border-radius:4px;background:var(--soft2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:var(--olive);transition:width .4s}
nav.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;transition:background-color .35s}
nav.top .wrap{display:flex;align-items:center;gap:6px;min-height:64px;flex-wrap:wrap}
nav.top a.tab{padding:8px 14px;border-radius:999px;text-decoration:none;font-size:14px}
nav.top a.tab.on{background:var(--ink);color:var(--bg);font-weight:500}
.brand{font-family:Fraunces,serif;font-size:22px;margin-right:20px;text-decoration:none}
.save{font-size:13px;color:var(--muted);margin-left:auto;min-width:70px;text-align:right}
main.page{padding:32px 0 80px}
.check{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 12px;border-radius:12px;border:none;background:var(--soft);width:100%}
.box{width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;transition:background-color .2s,border-color .2s}
.box.on{background:var(--clay);border-color:var(--clay)}
.done-text{text-decoration:line-through;opacity:.5}
.x{border:none;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;flex:none}
.x:hover{background:var(--soft2)}
.photo-card{position:relative;display:block;border-radius:16px;overflow:hidden;text-decoration:none;color:#FFF6EC;background:#241F1A;border:none;padding:0;width:100%;text-align:left}
.photo-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.photo-card .shade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(20,16,12,.78))}
.photo-card .cap{position:absolute;left:14px;right:14px;bottom:12px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--soft2);flex-wrap:wrap}
.tabs button{height:36px;padding:0 16px;border-radius:999px;border:none;background:transparent;font-size:14px;font-weight:500}
.tabs button.on{background:var(--card)}
.side-item{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:16px;border:1px solid transparent;background:transparent;width:100%}
.side-item.on{background:var(--card);border-color:var(--line)}
.mod{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:none;background:transparent;width:100%}
.mod.on{background:var(--sel);font-weight:600}
.tool{min-width:36px;height:36px;padding:0 8px;border:none;border-radius:9px;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.tool:hover{background:var(--soft2)}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);outline:1px solid var(--line);padding:0;margin:0 2px}
.swatch.sq{border-radius:6px}
.toolbar{display:none;flex:1;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 16px rgba(36,31,26,.08)}
.ed-bar{position:sticky;top:76px;z-index:4;display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:12px}
.ed-bar .fmt-btn{background:var(--card);box-shadow:0 4px 12px rgba(36,31,26,.08);flex:none}
body.fmt .toolbar{display:flex}
.hover-btn{opacity:0;transition:opacity .2s}.cover-wrap:hover .hover-btn,.hover-btn:focus-visible{opacity:1}

.pg:hover{background:var(--soft)}.pg.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.btn.done-on{background:var(--olive);border-color:var(--olive);color:#FFF6EC}
.ed-head{display:flex;justify-content:flex-end;margin-bottom:8px}
.fmt-btn{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
body.fmt .fmt-btn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.title-in{width:100%;border:none;border-bottom:1.5px dashed transparent;background:transparent;padding:0 0 4px;border-radius:0;transition:border-color .2s}
.title-in:hover{border-bottom-color:var(--line)}
.title-in:focus{outline:none;border-bottom-color:var(--clay)}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.editor{min-height:320px;font-family:'DM Sans',system-ui,sans-serif;font-size:16.5px;line-height:1.7;padding:4px 0 8px;outline:none}
.editor:empty:before{content:attr(data-ph);color:var(--muted)}
.editor h2{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:600;margin:22px 0 8px}
.editor h3{font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;margin:18px 0 6px}
.editor p{margin:0 0 12px}
.editor img{max-width:100%;border-radius:12px;display:block;margin:12px 0}
.editor .callout{background:var(--callout);border-radius:12px;padding:14px 16px;margin:12px 0;font-family:'DM Sans',sans-serif;font-size:15px}
.editor ul.checklist{list-style:none;padding-left:0}
.editor ul.checklist li{position:relative;padding-left:30px;font-family:'DM Sans',sans-serif;font-size:16px;margin:6px 0}
.editor ul.checklist li:before{content:"";position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);cursor:pointer}
.editor ul.checklist li[data-checked="true"]{text-decoration:line-through;opacity:.55}
.editor ul.checklist li[data-checked="true"]:before{background:var(--olive);border-color:var(--olive)}
.editor a{color:var(--sea)}
.pin{position:absolute;padding:7px 7px 20px;background:#fff}
.pin:after{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pin,#A65A3C)}
.pin img{display:block;width:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;box-shadow:var(--shadow)}
.fclock{display:flex;align-items:center;gap:10px;--tw:78px;--th:112px;--fs:84px}
.tile{position:relative;width:var(--tw);height:var(--th);border-radius:12px;perspective:420px;box-shadow:0 10px 22px rgba(36,31,26,.18),0 2px 4px rgba(36,31,26,.12)}
.tile .h{position:absolute;inset:0;border-radius:12px;font-family:Fraunces,Georgia,serif;font-size:var(--fs);text-align:center;line-height:var(--th);background:var(--tile);color:var(--tileInk);backface-visibility:hidden}
.tile .t{clip-path:inset(0 0 50% 0)}.tile .b{clip-path:inset(50% 0 0 0);background:var(--tileLow)}
.tile .ft{transform-origin:50% 50%;z-index:2}.tile .fb{transform-origin:50% 50%;z-index:2}
.tile.go .ft{animation:ftop .6s cubic-bezier(.4,0,.6,1) both}.tile.go .fb{animation:fbot .6s cubic-bezier(.4,0,.6,1) both}
.tile:after{content:"";position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:var(--bg);opacity:.35;z-index:3}
.tile i{position:absolute;top:calc(50% - 6px);width:5px;height:12px;border-radius:2px;background:var(--pin);z-index:4}.tile i.l{left:-2px}.tile i.r{right:-2px}
@keyframes ftop{0%{transform:rotateX(0)}50%,100%{transform:rotateX(-90deg)}}
@keyframes fbot{0%,50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.fcolon{display:flex;flex-direction:column;gap:18px;padding:0 4px;animation:blink 2s ease-in-out infinite}.fcolon span{width:10px;height:10px;border-radius:50%;background:#C98A3A}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
:root{--tile:#2B2520;--tileLow:#241F1A;--tileInk:#F6EEE2;--pin:#5A4E42}
body.dark{--tile:#F3EADC;--tileLow:#E8DDCB;--tileInk:#17130F;--pin:#6A5E52}
.hero{border-radius:28px;padding:clamp(28px,3.5vw,48px) clamp(24px,4vw,56px);background:var(--hbg);color:var(--hink);transition:background-color .6s,color .6s}
.hero .hsub{color:var(--hsub)}.hero .hacc{color:var(--hacc)}
.sky-m{--hbg:#F1DCCB;--hink:#2B1F18;--hsub:#7A3E24;--hacc:#A65A3C}
.sky-a{--hbg:#ECE3D0;--hink:#241F1A;--hsub:#5E5A3E;--hacc:#4E5C33}
.sky-e,body.dark .hero{--hbg:#2A221C;--hink:#F3EADC;--hsub:#B9A894;--hacc:#E0A866;--tile:#F3EADC;--tileLow:#E6D9C6;--tileInk:#2A221C;--pin:#7A6A5A}
.sky-e .tile:after,body.dark .hero .tile:after{background:#2A221C}
.hero .tile:after{background:var(--hbg)}
@media (max-width:700px){.fclock{--tw:54px;--th:78px;--fs:58px;gap:6px}.fcolon{gap:12px}.fcolon span{width:7px;height:7px}}
@media (prefers-reduced-motion:reduce){.tile.go .ft,.tile.go .fb,.fcolon{animation:none}}
.modal-bg{position:fixed;inset:0;background:rgba(20,16,12,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal{background:var(--card);border-radius:20px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.tm{max-width:480px;margin:0 auto}
@media (max-width:900px){.s4,.s5,.s7,.s8{grid-column:span 12}.wrap{padding:0 18px}.hide-sm{display:none}}
@media (min-width:1400px){.card{padding:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- sanitizer for rich text ---------- */
var OK_TAGS={P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,H2:1,H3:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,SPAN:1,FONT:1,DIV:1,IMG:1,A:1,HR:1};

  var doc=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html');var root=doc.body.firstChild;

    if(c.nodeType!==1||!OK_TAGS[c.tagName]){if(c.nodeType===1&&c.tagName!=='SCRIPT'&&c.tagName!=='STYLE'){walk(c);while(c.firstChild)n.insertBefore(c.firstChild,c)}c.remove();return}
    Array.prototype.slice.call(c.attributes).forEach(function(a){
      var k=a.name.toLowerCase(),v=a.value;
      if(k==='style'){var keep=[];v.split(';').forEach(function(d){var p=d.split(':');var key=(p[0]||'').trim().toLowerCase();if((key==='color'||key==='background-color')&&p[1]&&!/url|expression/i.test(p[1]))keep.push(key+':'+p[1].trim())});keep.length?c.setAttribute('style',keep.join(';')):c.removeAttribute('style')}
      else if(k==='href'){if(!/^https?:\/\//i.test(v))c.removeAttribute('href');else{c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}}

      else c.removeAttribute(a.name);
    });walk(c);})})(root);

/* ---------- writes (one at a time per document) ---------- */
var queue={},pending=0;
function setSave(state){var el=document.getElementById('saveState');if(el)el.textContent=state}
function write(col,id,data,create){

/* ---------- uploads ---------- */
function pickFile(accept,cb){var f=document.getElementById('filePick');f.value='';f.accept=accept;f.onchange=function(){if(f.files[0])cb(f.files[0])};f.click()}
function shrink(file){return new Promise(function(res){if(!/^image\/(jpeg|png|webp)/.test(file.type))return res(file);var u=URL.createObjectURL(file);var im=new Image();im.onload=function(){var m=1800,w=im.width,h=im.height,s=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.85)};im.onerror=function(){res(file)};im.src=u})}
function upload(file){setSave('Uploading…');return shrink(file).then(function(b){var ext=(b.type==='image/jpeg'?'jpg':(file.name.split('.').pop()||'bin')).toLowerCase().replace(/[^a-z0-9]/g,'');var path=user.id+'/'+uid()+'.'+ext;return sb.storage.from('photos').upload(path,b,{contentType:b.type||file.type,upsert:false}).then(function(r){if(r.error)throw r.error;return sb.storage.from('photos').createSignedUrl(path,604800)}).then(function(r){var key='sb:'+path;if(r.data)signed[key]=r.data.signedUrl;setSave('Saved');return key})}).catch(function(e){toast('Upload failed. Try a smaller file (max 20 MB).');setSave('');throw e})}

/* ---------- routing ---------- */
var ROUTES=['home','courses','interests','trips','trip','tripmode'];
function route(){var h=location.hash.replace('#','');return ROUTES.indexOf(h)>=0?h:'home'}
function go(r){if(location.hash==='#'+r)render();else location.hash=r;window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){flush();render();window.scrollTo(0,0)});

/* ---------- derived ---------- */
function program(){var mods=S.modules,done=mods.filter(function(m){return m.done}).length;return{total:mods.length,done:done}}
function courseMods(cid){return S.modules.filter(function(m){return m.courseId===cid}).sort(byOrder)}
function modPages(mid){return S.pages.filter(function(p){return p.moduleId===mid}).sort(byOrder)}
function ensurePage(m){var ps=modPages(m.id);if(ps.length)return ps;create('pages',{moduleId:m.id,order:1,title:'Lecture notes',notesHtml:m.notesHtml||'',updated:m.updated||0});return modPages(m.id)}
function nextModule(){var cs=S.courses.slice().sort(byOrder);for(var i=0;i<cs.length;i++){var ms=courseMods(cs[i].id);for(var j=0;j<ms.length;j++)if(!ms[j].done)return{c:cs[i],m:ms[j]}}return null}
function upcomingTrips(){var t=today();return S.trips.filter(function(x){return x.status!=='Bucket list'&&x.end&&x.end>=t}).sort(function(a,b){return (a.start||'')<(b.start||'')?-1:1})}
function activeTrip(){var t=today();return S.trips.filter(function(x){return x.start&&x.end&&x.status!=='Bucket list'&&daysBetween(t,x.start)<=2&&x.end>=t}).sort(function(a,b){return a.start<b.start?-1:1})[0]||null}
function tripDays(tr){if(!tr.start||!tr.end)return tr.days||[];var n=daysBetween(tr.start,tr.end)+1;if(n<1||n>60)return tr.days||[];var d=(tr.days||[]).slice(0,n);while(d.length<n)d.push({title:'',items:[]});return d}
function statusPill(s){var m={'Booked':'p-olive','Planning':'p-gold','Bucket list':'p-sea','Done':'p-grey'};return '<span class="pill '+(m[s]||'p-grey')+'">'+esc(s||'Planning')+'</span>'}

  tabs.map(function(t){var on=r===t[0]||(t[0]==='trips'&&(r==='trip'));return '<a href="#'+t[0]+'" class="tab'+(on?' on':'')+'"'+(on?' aria-current="page"':'')+'>'+t[1]+'</a>'}).join('')+

function clockDigits(){var n=new Date();return (String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0')).split('')}
function tileHtml(d){return '<span class="tile" data-d="'+d+'"><span class="h t">'+d+'</span><span class="h b">'+d+'</span><span class="h t ft">'+d+'</span><span class="h b fb">'+d+'</span><i class="l"></i><i class="r"></i></span>'}
function clockHtml(){var d=clockDigits();return tileHtml(d[0])+tileHtml(d[1])+'<span class="fcolon" aria-hidden="true"><span></span><span></span></span>'+tileHtml(d[2])+tileHtml(d[3])}
var clockDay=new Date().getDate();
function tickClock(){var c=document.getElementById('clk');if(!c)return;var d=clockDigits(),ts=c.querySelectorAll('.tile');c.setAttribute('aria-label','Current time '+d[0]+d[1]+':'+d[2]+d[3]);
  ts.forEach(function(t,i){var old=t.dataset.d,nw=d[i];if(old===nw)return;t.dataset.d=nw;var q=t.querySelectorAll('.h');q[0].textContent=nw;q[1].textContent=old;q[2].textContent=old;q[3].textContent=nw;t.classList.remove('go');void t.offsetWidth;t.classList.add('go')});
  var hr=document.getElementById('hero');if(hr&&!hr.classList.contains('sky-'+skyPart())){if(!editing())render()}
  if(new Date().getDate()!==clockDay){clockDay=new Date().getDate();if(!editing())render()}}
function skyPart(){var h=new Date().getHours();return h>=5&&h<12?'m':h>=12&&h<18?'a':'e'}
function greeting(){var h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}

function viewTripMode(){
  var t=(ui.tmId&&find('trips',ui.tmId))||activeTrip()||(ui.tripId&&find('trips',ui.tripId));
  if(!t)return '<main class="page"><div class="wrap tm"><div class="empty">Trip mode turns on automatically 2 days before a trip starts.</div></div></main>';
  var days=tripDays(t),idx=t.start?Math.max(0,Math.min(days.length-1,daysBetween(t.start,today()))):0,before=t.start&&today()<t.start,d=days[idx]||{items:[]};
  var now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var items=(d.items||[]).slice().sort(function(a,b){return (a.time||'99')<(b.time||'99')?-1:1});var next=before?null:items.filter(function(x){return (x.time||'99')>=hm})[0];
  var tab=ui.tmTab||'today';
  var h='<div class="tm"><div style="position:relative;height:220px;overflow:hidden;background:#241F1A">'+img(t.cover||S.settings.defaultTrip,'','width:100%;height:100%;object-fit:cover;opacity:.82')+'<span style="position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(20,16,12,.82))"></span><div style="position:absolute;left:20px;right:20px;bottom:16px;color:#FFF6EC"><p style="margin:0 0 2px;font-size:13px;color:#EADFCC">'+(before?'Starts in '+daysBetween(today(),t.start)+' day'+(daysBetween(today(),t.start)===1?'':'s'):'Day '+(idx+1)+' of '+days.length+(d.title?', '+esc(d.title):''))+'</p><h1 class="serif" style="font-size:40px;font-weight:400;line-height:1">'+esc(t.name)+'</h1></div></div><div style="padding:16px;display:flex;flex-direction:column;gap:16px">';

app.addEventListener('input',function(e){

app.addEventListener('paste',function(e){

  if(files.length){e.preventDefault();var range=saveRange();files.reduce(function(pr,f){return pr.then(function(){return upload(f).then(function(u){restoreRange(range);ed.focus();document.execCommand('insertHTML',false,'<img src="'+esc(rs(u))+'" data-sb="'+esc(u)+'" alt=""><p><br></p>');range=saveRange()})})},Promise.resolve()).then(function(){saveEditor(ed)},function(){toast('That image could not be pasted. Try the image button.')});return}

/* rich text commands */
function runCmd(b){
  var ed=app.querySelector('.editor');if(!ed)return;ed.focus();var c=b.dataset.cmd,v=b.dataset.val;
  try{document.execCommand('styleWithCSS',false,true)}catch(e){}
  if(c==='bold'||c==='italic'||c==='underline')document.execCommand(c);
  else if(c==='h2'){var blk=document.queryCommandValue('formatBlock');document.execCommand('formatBlock',false,/h2/i.test(blk)?'P':'H2')}
  else if(c==='ul')document.execCommand('insertUnorderedList');
  else if(c==='check')document.execCommand('insertHTML',false,'<ul class="checklist"><li data-checked="false">&#8203;</li></ul>');
  else if(c==='callout'){var sel=window.getSelection().toString();document.execCommand('insertHTML',false,'<div class="callout">'+(esc(sel)||'Note')+'</div><p><br></p>')}
  else if(c==='link'){linkForm(ed);return}
  else if(c==='color')document.execCommand('foreColor',false,v==='inherit'?getComputedStyle(document.body).color:v);
  else if(c==='hilite')document.execCommand('hiliteColor',false,v);
  else if(c==='clear')document.execCommand('removeFormat');
  else if(c==='image'){var range=saveRange();pickFile('image/*',function(f){upload(f).then(function(u){restoreRange(range);ed.focus();document.execCommand('insertHTML',false,'<img src="'+esc(rs(u))+'" data-sb="'+esc(u)+'" alt=""><p><br></p>');saveEditor(ed)})});return}
  saveEditor(ed);
}
function saveRange(){var s=window.getSelection();return s.rangeCount?s.getRangeAt(0).cloneRange():null}
function restoreRange(r){if(!r)return;var s=window.getSelection();s.removeAllRanges();s.addRange(r)}

function linkForm(ed){var r=saveRange();modal('<h2 class="h2" style="font-size:22px">Add a link</h2><label class="f" for="lf1">Link</label><input id="lf1" class="input" name="url" placeholder="https://…" required><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" data-close>Cancel</button><button class="btn dark">Add</button></div>',function(fd){restoreRange(r);ed.focus();var u=safeUrl(fd.get('url'));if(window.getSelection().toString())document.execCommand('createLink',false,u);else document.execCommand('insertHTML',false,'<a href="'+esc(u)+'">'+esc(u)+'</a>&nbsp;');saveEditor(ed)})}

/* ---------- export ---------- */
function exportAll(){
  var out='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Notes export</title><style>body{font-family:Georgia,serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6}h1{font-size:32px}h2{margin-top:40px}h3{margin-top:28px}.callout{background:#EEF1E6;padding:12px;border-radius:8px}img{max-width:100%}</style></head><body><h1>Notes export, '+new Date().toLocaleDateString('en-GB')+'</h1>';
  S.courses.slice().sort(byOrder).forEach(function(c){out+='<h2>'+esc(c.title)+'</h2>';courseMods(c.id).forEach(function(m){out+='<h3>'+esc(m.title)+(m.done?' (done)':'')+'</h3>'+(m.lectureUrl?'<p>Lecture: '+esc(m.lectureUrl)+'</p>':'')+(m.slidesUrl?'<p>Slides: '+esc(m.slidesUrl)+'</p>':'')+(modPages(m.id).length?modPages(m.id).map(function(q){return '<h4>'+esc(q.title||'Untitled page')+'</h4>'+(sanitize(q.notesHtml)||'<p><i>No notes</i></p>')}).join(''):(sanitize(m.notesHtml)||'<p><i>No notes</i></p>'))})});
  out+='<h2>Interests</h2>';S.topics.forEach(function(t){out+='<h3>'+esc(t.name)+'</h3>'+(sanitize(t.notesHtml)||'')});
  out+='<h2>Trips</h2>';S.trips.forEach(function(t){out+='<h3>'+esc(t.name)+'</h3>'+(sanitize(t.notesHtml)||'')+((t.bookings||[]).length?'<ul>'+t.bookings.map(function(b){return '<li>'+esc(b.kind+': '+b.title+' '+(b.detail||'')+' '+(b.ref||''))+'</li>'}).join('')+'</ul>':'')});
  out+='</body></html>';
  dl('notes-export-'+today()+'.html',out,'text/html');
  setTimeout(function(){dl('dashboard-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json')},400);
  toast('Downloaded your notes and a full backup');
}
function dl(name,data,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
function importBackup(){var f=document.getElementById('importPick');f.value='';f.onchange=function(){var file=f.files[0];if(!file)return;file.text().then(function(t){var d=JSON.parse(t);var cols=['todos','courses','modules','pages','trips','topics'];var rows=[];if(d.settings)rows.push({user_id:user.id,col:'settings',id:'main',data:d.settings});cols.forEach(function(c){(d[c]||[]).forEach(function(x){var b=Object.assign({},x);delete b.id;rows.push({user_id:user.id,col:c,id:x.id,data:b})})});return sb.from('docs').upsert(rows)}).then(function(r){if(r&&r.error)throw r.error;toast('Backup restored');loadAll()}).catch(function(){toast('That file isn\'t a dashboard backup.')})};f.click()}

function loginView(msg,mode){
  mode=mode||'in';
  app.innerHTML='<main class="page"><div class="wrap" style="max-width:440px"><div class="card fade" style="margin-top:8vh"><h1 class="serif" style="font-size:38px;font-weight:400;margin-bottom:6px">'+(mode==='in'?'Welcome back':'Create your account')+'</h1><p class="muted" style="margin:0 0 8px">'+(mode==='in'?'Sign in to your dashboard.':'One time only. Use an email you can check.')+'</p>'+
  '<form id="authForm"><label class="f" for="aE">Email</label><input id="aE" class="input" type="email" name="email" autocomplete="email" required><label class="f" for="aP">Password</label><input id="aP" class="input" type="password" name="password" autocomplete="'+(mode==='in'?'current-password':'new-password')+'" minlength="8" required>'+
  '<p id="aMsg" role="alert" style="min-height:22px;margin:12px 0 0;font-size:14px;color:'+(msg&&msg.ok?'var(--olive)':'#9E5638')+'">'+esc(msg?msg.text:'')+'</p><button class="btn dark" style="width:100%;justify-content:center;margin-top:8px">'+(mode==='in'?'Sign in':'Create account')+'</button></form>'+
  '<p class="muted" style="text-align:center;margin:16px 0 0;font-size:14px">'+(mode==='in'?'First time? <button class="btn sm ghost" id="aSwitch">Create account</button>':'Already have one? <button class="btn sm ghost" id="aSwitch">Sign in</button>')+'</p></div></div></main>';
  document.getElementById('aSwitch').onclick=function(){loginView(null,mode==='in'?'up':'in')};
  document.getElementById('authForm').onsubmit=function(e){e.preventDefault();var fd=new FormData(e.target),em=fd.get('email').trim(),pw=fd.get('password');var m=document.getElementById('aMsg');m.style.color='var(--muted)';m.textContent='One moment…';
    var p=mode==='in'?sb.auth.signInWithPassword({email:em,password:pw}):sb.auth.signUp({email:em,password:pw});
    p.then(function(r){if(r.error){m.style.color='#9E5638';m.textContent=r.error.message==='Invalid login credentials'?'Wrong email or password.':r.error.message;return}
      if(mode==='up'&&!r.data.session){loginView({ok:1,text:'Check your email and click the confirmation link, then sign in here.'},'in');return}
      user=r.data.user;start()})};
}
function start(){app.innerHTML='<div class="wrap" style="padding-top:80px"><p class="muted">Loading your dashboard…</p></div>';loadAll().then(subscribe)}
var started=false;
function loadAll(){
  return sb.from('docs').select('col,id,data').limit(5000).then(function(r){
    if(r.error){app.innerHTML='<div class="wrap" style="padding-top:80px"><p class="muted">Couldn\'t load your data: '+esc(r.error.message)+'. Check the setup script ran, then refresh.</p></div>';return}
    if(!r.data.length){return sb.from('docs').upsert(SEED.map(function(x){return{user_id:user.id,col:x.col,id:x.id,data:x.data}})).then(function(r2){if(r2.error){toast('Setup failed: '+r2.error.message);return}return loadAll()})}
    var N={settings:{},todos:[],courses:[],modules:[],pages:[],trips:[],topics:[]};
    r.data.forEach(function(row){if(row.col==='settings')N.settings=row.data||{};else if(N[row.col])N[row.col].push(Object.assign({id:row.id},row.data))});
    S=N;loaded.courses=1;scanRefs();
    if(!started){started=true;var at=activeTrip();if(at&&!location.hash&&window.innerWidth<700){ui.tmId=at.id;location.hash='tripmode';return}}
    softRender();
  });
}
var pendingPath={};
function subscribe(){
  if(!user)return;
  sb.channel('docs-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'user_id=eq.'+user.id},function(p){
    var row=p.eventType==='DELETE'?p.old:p.new;if(!row||!row.col)return;var path=row.col+'/'+row.id;if(pendingPath[path])return;
    if(row.col==='settings'){if(p.eventType!=='DELETE')S.settings=row.data||{}}
    else if(S[row.col]){S[row.col]=S[row.col].filter(function(x){return x.id!==row.id});if(p.eventType!=='DELETE')S[row.col].push(Object.assign({id:row.id},row.data))}
    scanRefs();softRender();
  }).subscribe();
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!editing()&&!pending)loadAll()});
}
function boot(){
  if(!window.supabase){app.innerHTML='<div class="wrap" style="padding-top:80px"><p class="muted">Couldn\'t load. Check your internet connection and refresh.</p></div>';return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.getSession().then(function(r){var s0=r.data&&r.data.session;if(s0){user=s0.user;start()}else loginView()});
}

setInterval(tickClock,1000);
boot();
})();
